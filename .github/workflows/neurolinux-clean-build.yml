name: NeuroLinux OS clean APK build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/neurolinux-clean-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Fetch upstream rootless Linux engine
        run: |
          git clone --depth 1 https://github.com/oonid/pr.git upstream-pr
          git -C upstream-pr submodule update --init --depth 1 vendor/termlib
          test -f upstream-pr/android/app/src/main/java/id/or/oo/pr/MainActivity.kt
          test -f upstream-pr/android/proot-engine/src/main/jniLibs/arm64-v8a/libproot.so

      - name: Apply minimal NeuroLinux branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("upstream-pr/android")
          gradle = root / "app/build.gradle.kts"
          s = gradle.read_text()
          s = s.replace('applicationId = "id.or.oo.pr"', 'applicationId = "org.neurolinux.desktop"')
          s = s.replace('versionName = "1.0.0"', 'versionName = "0.5.0"')
          s = s.replace('versionCode = 1', 'versionCode = 50')
          gradle.write_text(s)
          strings = root / "app/src/main/res/values/strings.xml"
          strings.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <string name="app_name">NeuroLinux OS</string>\n</resources>\n')
          PY

      - name: Build APK from clean upstream source
        working-directory: upstream-pr/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean :app:assembleDebug

      - name: Verify APK
        run: |
          APK="upstream-pr/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          du -h "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroLinuxOS-clean-ARM64
          path: upstream-pr/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neurolinux-os-clean-build-${{ github.run_number }}
          name: NeuroLinux OS clean build ${{ github.run_number }}
          body: |
            Clean ARM64 debug APK built from upstream oonid/pr source with minimal NeuroLinux branding.
            Root and Termux are not required. This clean build intentionally excludes custom desktop patches while establishing a reliable build baseline.
          files: upstream-pr/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
