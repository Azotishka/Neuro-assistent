name: Build NeuroLinux OS standalone APK

on:
  push:
    branches: [main]
    paths:
      - 'neurolinux/**'
      - '.github/workflows/neurolinux-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build standalone NeuroLinux APK (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout NeuroLinux configuration
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Fetch standalone rootless Linux engine
        run: |
          git clone --depth 1 https://github.com/oonid/pr.git upstream-pr
          # Only this submodule is needed by the Android Gradle build. Avoid unrelated
          # git@github.com and git:// submodules used for upstream native source builds.
          git -C upstream-pr submodule update --init --depth 1 vendor/termlib
          test -f upstream-pr/android/proot-engine/src/main/jniLibs/arm64-v8a/libproot.so
          test -f upstream-pr/android/proot-engine/src/main/jniLibs/arm64-v8a/libpr-cli.so
          test -f upstream-pr/android/app/src/main/java/id/or/oo/pr/MainActivity.kt

      - name: Apply NeuroLinux branding and Russian UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("upstream-pr/android")
          gradle = root / "app/build.gradle.kts"
          s = gradle.read_text()
          s = s.replace('applicationId = "id.or.oo.pr"', 'applicationId = "org.neurolinux.desktop"')
          s = s.replace('versionName = "1.0.0"', 'versionName = "0.4.0"')
          gradle.write_text(s)

          strings = root / "app/src/main/res/values/strings.xml"
          strings.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NeuroLinux OS</string>
          </resources>
          ''')

          main = root / "app/src/main/java/id/or/oo/pr/MainActivity.kt"
          s = main.read_text()
          if "import androidx.compose.ui.graphics.Color" not in s:
              s = s.replace("import androidx.compose.ui.unit.dp", "import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.unit.dp")
          replacements = {
              'val darkTheme = isSystemInDarkTheme()': 'val darkTheme = true',
              'Text("PR")': 'Text("NeuroLinux OS")',
              '"Custom OCI image"': '"Установка образа Linux"',
              '"ℹ️ Images"': '"ℹ️ Образы"',
              '"Image reference"': '"Образ Linux"',
              '"Alias (optional)"': '"Имя (необязательно)"',
              '"Install"': '"Установить"',
              '"Installing"': '"Установка"',
              '"Removing"': '"Удаление"',
              '"Testing"': '"Проверка"',
              '"Installed"': '"Установлен"',
              '"Not installed"': '"Не установлен"',
              '"Completed"': '"Завершено"',
              '"Close"': '"Закрыть"',
              '"Choose OCI image"': '"Выбрать образ Linux"',
              '"Alpine Latest"': '"Alpine — стабильная"',
              '"Alpine Edge"': '"Alpine — Edge"',
              '"Ubuntu Latest"': '"Ubuntu — последняя"',
              '"Debian Stable"': '"Debian — стабильная"',
              '"Debian Testing"': '"Debian — тестовая"',
              '"Fedora Latest"': '"Fedora — последняя"',
              '"Arch Linux"': '"Arch Linux"',
              '"Login"': '"Запустить"',
              '"More options"': '"Другие действия"',
              '"Test"': '"Проверить"',
              '"Remove"': '"Удалить"',
              '"ERROR: Invalid alias \'$alias\'."': '"ОШИБКА: неверное имя \'$alias\'."',
              '"Alias must start with an alphanumeric character and use only [A-Za-z0-9_.+-]."': '"Имя должно начинаться с буквы/цифры и содержать только A-Z, a-z, 0-9, _, ., + или -."',
              '"Installing $source…"': '"Установка $source…"',
              '"Installing ${distro.displayName}…"': '"Установка ${distro.displayName}…"',
              '"Removing ${distro.displayName}…"': '"Удаление ${distro.displayName}…"',
              '"Testing ${distro.displayName}…"': '"Проверка ${distro.displayName}…"',
              '"Exit code: $exitCode"': '"Код завершения: $exitCode"',
              '"Done."': '"Готово."',
              '"ERROR: ${e.message}"': '"ОШИБКА: ${e.message}"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Add a branded launcher/dashboard above the distribution manager.
          anchor = '            item {\n                CustomImageInstallCard('
          replacement = '            item {\n                NeuroLinuxHomeCard(installedCount = distros.count { it.isInstalled })\n            }\n            item {\n                CustomImageInstallCard('
          if anchor not in s:
              raise SystemExit("Could not locate LazyColumn insertion point")
          s = s.replace(anchor, replacement, 1)

          marker = """// ---------------------------------------------------------------------------
          // Custom OCI install card
          // ---------------------------------------------------------------------------"""
          home = r'''// ---------------------------------------------------------------------------
          // NeuroLinux home / workspace card
          // ---------------------------------------------------------------------------
          
          @Composable
          fun NeuroLinuxHomeCard(
              installedCount: Int,
              onOpenTerminal: () -> Unit,
              onInstallDebian: () -> Unit,
          ) {
              ElevatedCard(
                  modifier = Modifier
            .fillMaxWidth()
            .padding(horizontal = 12.dp, vertical = 10.dp),
                  colors = CardDefaults.elevatedCardColors(
            containerColor = Color(0xFF111827),
            contentColor = Color(0xFFF8FAFC)
                  ),
                  elevation = CardDefaults.elevatedCardElevation(defaultElevation = 5.dp)
              ) {
                  Column(
            modifier = Modifier
                .fillMaxWidth()
                .padding(20.dp),
            verticalArrangement = Arrangement.spacedBy(14.dp)
                  ) {
            Row(
                verticalAlignment = Alignment.CenterVertically,
                horizontalArrangement = Arrangement.spacedBy(12.dp)
            ) {
                Surface(
                    shape = MaterialTheme.shapes.large,
                    color = Color(0xFF123C3A),
                    modifier = Modifier.size(52.dp)
                ) {
                    Box(contentAlignment = Alignment.Center) {
                        Text("N", color = Color(0xFF5EEAD4), style = MaterialTheme.typography.headlineMedium, fontWeight = FontWeight.Bold)
                    }
                }
                Column(modifier = Modifier.weight(1f)) {
                    Text("NEUROLINUX OS", style = MaterialTheme.typography.labelMedium, color = Color(0xFF5EEAD4), fontWeight = FontWeight.Bold)
                    Text("Рабочее пространство", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold)
                    Text("Linux прямо в приложении · без root и Termux", style = MaterialTheme.typography.bodySmall, color = Color(0xFFCBD5E1))
                }
            }
          
            Row(
                modifier = Modifier.fillMaxWidth(),
                horizontalArrangement = Arrangement.spacedBy(10.dp)
            ) {
                Surface(
                    modifier = Modifier.weight(1f),
                    shape = MaterialTheme.shapes.medium,
                    color = Color(0xFF1F2937)
                ) {
                    Column(Modifier.padding(12.dp)) {
                        Text("$installedCount", style = MaterialTheme.typography.headlineSmall, color = Color(0xFF5EEAD4), fontWeight = FontWeight.Bold)
                        Text("Систем установлено", style = MaterialTheme.typography.labelSmall, color = Color(0xFFE2E8F0))
                    }
                }
                Surface(
                    modifier = Modifier.weight(1f),
                    shape = MaterialTheme.shapes.medium,
                    color = Color(0xFF1F2937)
                ) {
                    Column(Modifier.padding(12.dp)) {
                        Text("ARM64", style = MaterialTheme.typography.titleLarge, color = Color(0xFF5EEAD4), fontWeight = FontWeight.Bold)
                        Text("Для планшетов Android", style = MaterialTheme.typography.labelSmall, color = Color(0xFFE2E8F0))
                    }
                }
            }
          
            Row(horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxWidth()) {
                Button(
                    onClick = onOpenTerminal,
                    enabled = installedCount > 0,
                    modifier = Modifier.weight(1f),
                    colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF14B8A6), contentColor = Color(0xFF042F2E))
                ) {
                    Icon(Icons.Default.PlayArrow, contentDescription = null)
                    Spacer(Modifier.width(6.dp))
                    Text("Открыть Linux")
                }
                OutlinedButton(
                    onClick = onInstallDebian,
                    modifier = Modifier.weight(1f),
                    colors = ButtonDefaults.outlinedButtonColors(contentColor = Color(0xFFCCFBF1))
                ) {
                    Icon(Icons.Default.Download, contentDescription = null)
                    Spacer(Modifier.width(6.dp))
                    Text("Установить Debian")
                }
            }
          
            Text(
                "Графический рабочий стол XFCE пока не включён. Сейчас доступна полноценная консоль Linux; установленные приложения запускаются в ней.",
                style = MaterialTheme.typography.bodySmall,
                color = Color(0xFFCBD5E1)
            )
                  }
              }
          }
          
          '''
          if marker not in s:
              raise SystemExit("Could not locate custom card marker")
          s = s.replace(marker, home + marker, 1)
          main.write_text(s)
          PY

      - name: Build standalone APK
        working-directory: upstream-pr/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK and architecture
        run: |
          APK="upstream-pr/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size:"
          du -h "$APK"
          echo "APK SHA-256:"
          sha256sum "$APK"

      - name: Upload NeuroLinux APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroLinuxOS-0.4-standalone-arm64
          path: upstream-pr/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neurolinux-os-0.4.0-build-${{ github.run_number }}
          name: NeuroLinux OS 0.4.0 (build ${{ github.run_number }})
          body: |
            Standalone ARM64 Android APK with embedded rootless Linux user-space runtime and terminal.
            No Termux or root required. On first launch, download a Linux distribution in the app.
            This build includes the redesigned Russian home dashboard and standalone Linux terminal. XFCE graphical desktop is not included yet.
            Source engine: https://github.com/oonid/pr
          files: upstream-pr/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

