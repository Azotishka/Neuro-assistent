name: Build NeuroLinux OS APK

on:
  push:
    branches: [main]
    paths:
      - 'neurolinux-source.zip.b64'
      - '.github/workflows/neurolinux-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NeuroLinux debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Decode and unpack source bundle
        run: |
          base64 --decode neurolinux-source.zip.b64 > /tmp/neurolinux-source.zip
          unzip -t /tmp/neurolinux-source.zip
          mkdir -p neurolinux-src
          unzip -q /tmp/neurolinux-source.zip -d neurolinux-src
          test -f neurolinux-src/NeuroLinuxOS/app/src/main/java/org/neurolinux/desktop/MainActivity.java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: neurolinux-src/NeuroLinuxOS
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroLinuxOS-debug-apk
          path: neurolinux-src/NeuroLinuxOS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
