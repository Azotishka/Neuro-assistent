name: Build NeuroLinux OS standalone APK

on:
  push:
    branches: [main]
    paths:
      - 'neurolinux/**'
      - '.github/workflows/neurolinux-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build standalone NeuroLinux APK (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout NeuroLinux configuration
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Fetch standalone rootless Linux engine
        run: |
          git clone --depth 1 https://github.com/oonid/pr.git upstream-pr
          # Only this submodule is needed by the Android Gradle build. Avoid unrelated
          # git@github.com and git:// submodules used for upstream native source builds.
          git -C upstream-pr submodule update --init --depth 1 vendor/termlib
          test -f upstream-pr/android/proot-engine/src/main/jniLibs/arm64-v8a/libproot.so
          test -f upstream-pr/android/proot-engine/src/main/jniLibs/arm64-v8a/libpr-cli.so
          test -f upstream-pr/android/app/src/main/java/id/or/oo/pr/MainActivity.kt

      - name: Apply NeuroLinux branding and Russian UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("upstream-pr/android")
          gradle = root / "app/build.gradle.kts"
          s = gradle.read_text()
          s = s.replace('applicationId = "id.or.oo.pr"', 'applicationId = "org.neurolinux.desktop"')
          s = s.replace('versionName = "1.0.0"', 'versionName = "0.5.0"')
          s = s.replace('versionCode = 1', 'versionCode = 5')
          gradle.write_text(s)

          strings = root / "app/src/main/res/values/strings.xml"
          strings.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NeuroLinux OS</string>
          </resources>
          ''')

          main = root / "app/src/main/java/id/or/oo/pr/MainActivity.kt"
          s = main.read_text()
          if "import androidx.compose.ui.graphics.Color" not in s:
              s = s.replace("import androidx.compose.ui.unit.dp", "import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.unit.dp")
          replacements = {
              'val darkTheme = isSystemInDarkTheme()': 'val darkTheme = true',
              'Text("PR")': 'Text("NeuroLinux OS")',
              '"Custom OCI image"': '"Установка образа Linux"',
              '"ℹ️ Images"': '"ℹ️ Образы"',
              '"Image reference"': '"Образ Linux"',
              '"Alias (optional)"': '"Имя (необязательно)"',
              '"Install"': '"Установить"',
              '"Installing"': '"Установка"',
              '"Removing"': '"Удаление"',
              '"Testing"': '"Проверка"',
              '"Installed"': '"Установлен"',
              '"Not installed"': '"Не установлен"',
              '"Completed"': '"Завершено"',
              '"Close"': '"Закрыть"',
              '"Choose OCI image"': '"Выбрать образ Linux"',
              '"Alpine Latest"': '"Alpine — стабильная"',
              '"Alpine Edge"': '"Alpine — Edge"',
              '"Ubuntu Latest"': '"Ubuntu — последняя"',
              '"Debian Stable"': '"Debian — стабильная"',
              '"Debian Testing"': '"Debian — тестовая"',
              '"Fedora Latest"': '"Fedora — последняя"',
              '"Arch Linux"': '"Arch Linux"',
              '"Login"': '"Запустить"',
              '"More options"': '"Другие действия"',
              '"Test"': '"Проверить"',
              '"Remove"': '"Удалить"',
              '"ERROR: Invalid alias \'$alias\'."': '"ОШИБКА: неверное имя \'$alias\'."',
              '"Alias must start with an alphanumeric character and use only [A-Za-z0-9_.+-]."': '"Имя должно начинаться с буквы/цифры и содержать только A-Z, a-z, 0-9, _, ., + или -."',
              '"Installing $source…"': '"Установка $source…"',
              '"Installing ${distro.displayName}…"': '"Установка ${distro.displayName}…"',
              '"Removing ${distro.displayName}…"': '"Удаление ${distro.displayName}…"',
              '"Testing ${distro.displayName}…"': '"Проверка ${distro.displayName}…"',
              '"Exit code: $exitCode"': '"Код завершения: $exitCode"',
              '"Done."': '"Готово."',
              '"ERROR: ${e.message}"': '"ОШИБКА: ${e.message}"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Add a desktop launcher beside the normal terminal button.
          # Patch the current upstream Compose callback layout without whitespace-sensitive full snippets.
          import re
          call_pattern = re.compile(
              r'(                    onLogin = \{.*?\n                    \},\n)(                    onRemove = \{)',
              re.S
          )
          s, n = call_pattern.subn(
              lambda m: m.group(1) + '                    onDesktop = {\n                        if (loadingDistro == null) {\n                            val intent = Intent(context, DesktopActivity::class.java)\n                            intent.putExtra("distro", distro.alias)\n                            context.startActivity(intent)\n                        }\n                    },\n' + m.group(2),
              s, count=1
          )
          if n != 1:
              raise SystemExit("Could not safely insert desktop callback next to onLogin")
          sig_pattern = re.compile(r'(    onLogin: \(\) -> Unit,\n)(    onRemove: \(\) -> Unit,)')
          s, n = sig_pattern.subn(lambda m: m.group(1) + '    onDesktop: () -> Unit,\n' + m.group(2), s, count=1)
          if n != 1:
              raise SystemExit("Could not safely add DistroCard desktop callback parameter")
          action_anchor = "                    // Secondary actions: test + remove in overflow menu"
          if action_anchor not in s:
              raise SystemExit("Could not locate DistroCard secondary action row")
          s = s.replace(action_anchor, '                    IconButton(onClick = onDesktop) {\n                        Text("🖥", style = MaterialTheme.typography.titleMedium)\n                    }\n' + action_anchor, 1)
          # Add a branded launcher/dashboard above the distribution manager.
          anchor = '            item {\n                CustomImageInstallCard('
          replacement = '            item {\n                NeuroLinuxHomeCard(installedCount = distros.count { it.isInstalled })\n            }\n            item {\n                CustomImageInstallCard('
          if anchor not in s:
              raise SystemExit("Could not locate LazyColumn insertion point")
          s = s.replace(anchor, replacement, 1)

          marker = """// ---------------------------------------------------------------------------
          // Custom OCI install card
          // ---------------------------------------------------------------------------"""
          home = r'''@Composable
          fun NeuroLinuxHomeCard(installedCount: Int) {
              ElevatedCard(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(horizontal = 12.dp, vertical = 10.dp),
                  colors = CardDefaults.elevatedCardColors(
                      containerColor = Color(0xFF111827),
                      contentColor = Color(0xFFF8FAFC)
                  )
              ) {
                  Column(
                      modifier = Modifier.fillMaxWidth().padding(20.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Surface(
                              shape = MaterialTheme.shapes.large,
                              color = Color(0xFF123C3A),
                              modifier = Modifier.size(54.dp)
                          ) {
                              Box(contentAlignment = Alignment.Center) {
                                  Text("N", color = Color(0xFF5EEAD4), style = MaterialTheme.typography.headlineMedium, fontWeight = FontWeight.Bold)
                              }
                          }
                          Spacer(Modifier.width(14.dp))
                          Column(modifier = Modifier.weight(1f)) {
                              Text("NEUROLINUX OS", style = MaterialTheme.typography.labelMedium, color = Color(0xFF5EEAD4), fontWeight = FontWeight.Bold)
                              Text("Рабочее пространство", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold)
                              Text("Linux внутри Android · без root и Termux", style = MaterialTheme.typography.bodySmall, color = Color(0xFFCBD5E1))
                          }
                      }
                      HorizontalDivider(color = Color(0xFF334155))
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column {
                              Text("Установленные системы", style = MaterialTheme.typography.labelMedium, color = Color(0xFFCBD5E1))
                              Text("$installedCount", style = MaterialTheme.typography.headlineMedium, color = Color(0xFF5EEAD4), fontWeight = FontWeight.Bold)
                          }
                          Surface(shape = MaterialTheme.shapes.large, color = Color(0xFF123C3A)) {
                              Text("ARM64", modifier = Modifier.padding(horizontal = 14.dp, vertical = 8.dp), color = Color(0xFF99F6E4), fontWeight = FontWeight.Bold)
                          }
                      }
                      Text(
                          "Для рабочего стола установи Debian или Ubuntu, затем нажми 🖥 у дистрибутива. При первом запуске XFCE загрузит графические пакеты.",
                          style = MaterialTheme.typography.bodySmall,
                          color = Color(0xFFCBD5E1)
                      )
                  }
              }
          }
          '''
          if marker not in s:
              raise SystemExit("Could not locate custom card marker")
          s = s.replace(marker, home + marker, 1)
          main.write_text(s)

          main.write_text(s)

          # Request Android's battery-optimization exemption once; users can decline.
          imports = [
              "import android.content.Context",
              "import android.net.Uri",
              "import android.os.PowerManager",
              "import android.provider.Settings",
          ]
          for imp in imports:
              if imp not in s:
                  s = s.replace("import android.content.Intent", "import android.content.Intent\n" + imp, 1)
          battery_anchor = "\n    }\n}\n\n@OptIn(ExperimentalMaterial3Api::class)\n@Composable\nfun DistroListScreen"
          battery_replacement = """
                  requestBatteryOptimizationExemption()
              }

              private fun requestBatteryOptimizationExemption() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return
                  val prefs = getPreferences(android.content.Context.MODE_PRIVATE)
                  if (prefs.getBoolean("battery_exemption_prompted", false)) return
                  val power = getSystemService(Context.POWER_SERVICE) as PowerManager
                  if (power.isIgnoringBatteryOptimizations(packageName)) return
                  prefs.edit().putBoolean("battery_exemption_prompted", true).apply()
                  try {
                      startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                  } catch (_: Exception) {
                      try {
                          startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                      } catch (_: Exception) { }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun DistroListScreen"""
          if battery_anchor not in s:
              raise SystemExit("Could not safely locate MainActivity insertion point for battery settings")
          s = s.replace(battery_anchor, "\n" + battery_replacement, 1)
          main.write_text(s)

          # Embed the desktop activity and register it with Android.
          desktop_source = Path("neurolinux/DesktopActivity.kt")
          if not desktop_source.is_file():
              raise SystemExit("Missing neurolinux/DesktopActivity.kt")
          desktop_target = root / "app/src/main/java/id/or/oo/pr/DesktopActivity.kt"
          desktop_target.write_text(desktop_source.read_text())
          manifest = root / "app/src/main/AndroidManifest.xml"
          m = manifest.read_text()
          if 'android:usesCleartextTraffic="true"' not in m:
              app_attr = 'android:extractNativeLibs="true">'
              app_attr_new = 'android:extractNativeLibs="true"\n        android:usesCleartextTraffic="true">'
              if app_attr not in m:
                  raise SystemExit("Could not find Android application manifest attributes")
              m = m.replace(app_attr, app_attr_new, 1)
          # Prevent Activity recreation during rotation, split-screen and resizable-window changes.
          # Recreation was closing the direct PRoot desktop session and clearing its visible terminal.
          if 'android:name=".TerminalActivity"' in m:
              import re
              m = re.sub(
                  r'(<activity\s+android:name=".TerminalActivity".*?android:configChanges=")([^"]*)(")',
                  lambda x: x.group(1) + "|".join(sorted(set(x.group(2).split("|") + ["smallestScreenSize", "screenLayout", "density"])) ) + x.group(3),
                  m, count=1, flags=re.S
              )
          if 'android:name=".DesktopActivity"' not in m:
              activity = '        <activity\n            android:name=".DesktopActivity"\n            android:exported="false"\n            android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|density"\n            android:windowSoftInputMode="adjustResize" />\n'
              m = m.replace('    </application>', activity + '    </application>', 1)
          else:
              m = m.replace('android:configChanges="orientation|screenSize|keyboard|keyboardHidden"', 'android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|density"')
          manifest.write_text(m)
          PY

      - name: Build standalone APK
        working-directory: upstream-pr/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK and architecture
        run: |
          APK="upstream-pr/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size:"
          du -h "$APK"
          echo "APK SHA-256:"
          sha256sum "$APK"

      - name: Upload NeuroLinux APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroLinuxOS-0.5-standalone-arm64
          path: upstream-pr/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neurolinux-os-0.5.0-build-${{ github.run_number }}
          name: NeuroLinux OS 0.5.0 (build ${{ github.run_number }})
          body: |
            Standalone ARM64 Android APK with embedded rootless Linux user-space runtime and terminal.
            No Termux or root required. On first launch, download a Linux distribution in the app.
            Includes the redesigned Russian dashboard and an embedded XFCE desktop for Debian/Ubuntu through noVNC. First launch installs GUI packages into the selected Linux rootfs. VNC and WebSocket listeners use localhost only.
            Source engine: https://github.com/oonid/pr
          files: upstream-pr/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

