name: Build NeuroLinux OS APK

on:
  push:
    branches: [main]
    paths:
      - 'neurolinux/**'
      - '.github/workflows/neurolinux-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NeuroLinux debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: neurolinux
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroLinuxOS-debug-apk
          path: neurolinux/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
