name: Ashen Circuit VS1 - Native Android Fallback APK

on:
  push:
    branches: ["ashen-circuit-vs1"]
    paths:
      - "android-fallback/**"
      - ".github/workflows/ashen-circuit-native-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-fallback
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f android-fallback/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-fallback/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-fallback/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ashen-Circuit-VS1-Android-APK
          path: android-fallback/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
