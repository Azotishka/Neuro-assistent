name: Ashen Circuit VS1 - Native Android Fallback APK

on:
  push:
    branches: ["ashen-circuit-vs1"]
    paths:
      - "android-fallback/**"
      - ".github/workflows/ashen-circuit-native-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-fallback
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f android-fallback/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-fallback/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-fallback/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ashen-Circuit-VS1-Android-APK
          path: android-fallback/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as repository chunks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf generated-apk
          mkdir -p generated-apk
          python3 - <<'PY'
          import base64
          from pathlib import Path
          apk = Path('android-fallback/app/build/outputs/apk/debug/app-debug.apk')
          data = base64.b64encode(apk.read_bytes()).decode()
          Path('generated-apk/manifest.txt').write_text(f"filename=Ashen-Circuit-VS1.apk\nbytes={apk.stat().st_size}\nbase64_chars={len(data)}\n")
          for i in range(0, len(data), 900):
              n = i // 900 + 1
              Path(f'generated-apk/part-{n:03d}.b64').write_text(data[i:i+900])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated-apk
          git commit -m 'build: publish VS1 APK chunks [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
