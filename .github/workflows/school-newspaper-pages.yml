name: Publish school newspaper

on:
  push:
    branches: [gh-pages]
    paths:
      - 'admin/**'
      - 'assets/**'
      - 'content/**'
      - 'index.html'
      - 'mobile/**'
      - 'privacy.html'
      - '404.html'
      - 'build_catalogue.py'
      - '.github/workflows/school-newspaper-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-newspaper-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published branch
        uses: actions/checkout@v4

      - name: Generate catalogue from issue files
        run: python3 build_catalogue.py

      - name: Validate and stage public site
        run: |
          test -s index.html
          test -s admin/index.html
          test -s content/issues.json
          python3 -m json.tool content/issues.json > /dev/null
          mkdir _site
          cp index.html privacy.html 404.html .nojekyll _site/
          cp -R admin assets content _site/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: newspaper-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy from gh-pages branch
        id: deployment
        uses: actions/deploy-pages@v4
