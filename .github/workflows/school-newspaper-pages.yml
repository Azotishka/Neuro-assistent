name: Publish school newspaper

on:
  push:
    branches: [main]
    paths:
      - 'school-newspaper-site/**'
      - '.github/workflows/school-newspaper-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-newspaper-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout newspaper source
        uses: actions/checkout@v4

      - name: Generate issue catalogue
        run: python3 school-newspaper-site/build_catalogue.py

      - name: Validate public files
        run: |
          test -s school-newspaper-site/index.html
          test -s school-newspaper-site/admin/index.html
          test -s school-newspaper-site/content/issues.json
          python3 -m json.tool school-newspaper-site/content/issues.json > /dev/null

      - name: Upload newspaper artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: school-newspaper-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: newspaper-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy newspaper to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
