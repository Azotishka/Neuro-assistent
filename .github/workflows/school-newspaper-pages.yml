name: Publish school newspaper

on:
  push:
    branches: [main]
    paths:
      - 'school-newspaper-site/**'
      - '.github/workflows/school-newspaper-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: school-newspaper-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build issue catalogue from Markdown
        run: python3 school-newspaper-site/build_catalogue.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: school-newspaper-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
