name: Ashen Circuit VS1 - Unity 6.3 Android

on:
  push:
    branches: ["ashen-circuit-vs1"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCHIVE_SHA256: 02190d7db857b2bdae0cf54298bfc2905f1386b1c85b29157e44e1b0331ffefe

jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify project archive
        shell: bash
        run: |
          mkdir -p /tmp/ashen/project
          cat ashen-circuit-vs1/archive-chunks/part-*.b64 > /tmp/ashen/project.b64
          base64 -d /tmp/ashen/project.b64 > /tmp/ashen/Ashen-Circuit-VS1-ci.zip
          echo "$ARCHIVE_SHA256  /tmp/ashen/Ashen-Circuit-VS1-ci.zip" | sha256sum -c -
          unzip -q /tmp/ashen/Ashen-Circuit-VS1-ci.zip -d /tmp/ashen/project
          test -f /tmp/ashen/project/ProjectSettings/ProjectVersion.txt
      - name: Static V12 verification
        working-directory: /tmp/ashen/project
        run: |
          python3 tools/task1_verify.py
          python3 tools/verify_tasks.py
          python3 tools/verify_runtime_host.py
          python3 tools/verify_task11.py
          python3 tools/verify_task12.py

  unity:
    needs: static-gate
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify project archive
        shell: bash
        run: |
          mkdir -p /tmp/ashen/project
          cat ashen-circuit-vs1/archive-chunks/part-*.b64 > /tmp/ashen/project.b64
          base64 -d /tmp/ashen/project.b64 > /tmp/ashen/Ashen-Circuit-VS1-ci.zip
          echo "$ARCHIVE_SHA256  /tmp/ashen/Ashen-Circuit-VS1-ci.zip" | sha256sum -c -
          unzip -q /tmp/ashen/Ashen-Circuit-VS1-ci.zip -d /tmp/ashen/project

      - name: Generate Unity activation request
        if: env.UNITY_LICENSE == ''
        id: activation
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.0f1

      - name: Upload Unity activation request
        if: env.UNITY_LICENSE == ''
        uses: actions/upload-artifact@v4
        with:
          name: Ashen-Circuit-Unity-6000.3.0f1-activation
          path: ${{ steps.activation.outputs.filePath }}

      - name: Unity EditMode tests
        if: env.UNITY_LICENSE != ''
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: /tmp/ashen/project
          unityVersion: 6000.3.0f1
          testMode: editmode
          artifactsPath: unity-test-results/editmode

      - name: Unity PlayMode tests
        if: env.UNITY_LICENSE != ''
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: /tmp/ashen/project
          unityVersion: 6000.3.0f1
          testMode: playmode
          artifactsPath: unity-test-results/playmode

      - name: Android IL2CPP build
        if: env.UNITY_LICENSE != ''
        uses: game-ci/unity-builder@v4
        with:
          projectPath: /tmp/ashen/project
          unityVersion: 6000.3.0f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: AshenCircuit.Build.CiAndroidBuild.BuildAndroid
          customParameters: -nographics -batchmode -quit

      - name: Upload APK
        if: env.UNITY_LICENSE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Ashen-Circuit-VS1-Android-APK
          path: /tmp/ashen/project/Builds/Android/AshenCircuit-VS1.apk

      - name: Upload Unity test results
        if: env.UNITY_LICENSE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Ashen-Circuit-VS1-Unity-Test-Results
          path: |
            unity-test-results/editmode
            unity-test-results/playmode
