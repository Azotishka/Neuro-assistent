name: Build Neuro Nova Studio APK

concurrency:
  group: neuroassistant-apk-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main", "master", "tablet-xiaomi-pad7-pro", "superpowers-tablet-ai-hub", "neuro-nova-xiaomi-pad7-pro-redesign" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate compatibility bundle and run release tests
        working-directory: app/src/main/assets/local
        run: npm run build

      - name: Neuro Nova regression tests
        working-directory: app/src/main/assets/local
        run: node --test ./tests/neuro-nova-regression.test.mjs

      - name: JavaScript syntax audit
        run: |
          set -e
          find app/src/main/assets/local -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.inline=False; self.buf=[]; self.blocks=[]
              def handle_starttag(self, tag, attrs):
                  if tag == "script" and not dict(attrs).get("src"):
                      self.inline=True; self.buf=[]
              def handle_data(self, data):
                  if self.inline: self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.inline:
                      self.blocks.append("".join(self.buf)); self.inline=False
          parser=Scripts()
          parser.feed(Path("app/src/main/assets/local/index.html").read_text())
          for i, block in enumerate(parser.blocks):
              Path(f"/tmp/neuro-inline-{i}.js").write_text(block)
          print(f"Extracted {len(parser.blocks)} inline script(s) for syntax check")
          PY
          for file in /tmp/neuro-inline-*.js; do
            [ -f "$file" ] || continue
            node --check < "$file"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroNovaAILab-v0.24-ai-runtime-snake-headless-ui-audit-apk
          path: app/build/outputs/apk/debug/app-debug.apk
