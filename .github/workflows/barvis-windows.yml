name: Barvis Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'barvis/Barvis_Source.tar.xz'
      - '.github/workflows/barvis-windows.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Barvis source and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Barvis source archive
        run: mkdir -p '${{ runner.temp }}/barvis-source' && tar -xf 'barvis/Barvis_Source.tar.xz' -C '${{ runner.temp }}/barvis-source'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pydantic PyYAML
      - name: Run tests
        working-directory: ${{ runner.temp }}/barvis-source/Barvis
        run: python -m pytest -q
      - name: Compile Python sources
        working-directory: ${{ runner.temp }}/barvis-source/Barvis
        run: python -m compileall -q main.py core ui tests

  build:
    name: Build Windows application
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Barvis source archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\barvis-source" | Out-Null
          tar -xf 'barvis/Barvis_Source.tar.xz' -C "$env:RUNNER_TEMP\barvis-source"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Barvis dependencies
        working-directory: ${{ runner.temp }}/barvis-source/Barvis
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyinstaller
      - name: Run tests on Windows
        working-directory: ${{ runner.temp }}/barvis-source/Barvis
        run: python -m pytest -q
      - name: Build Barvis.exe
        shell: pwsh
        working-directory: ${{ runner.temp }}/barvis-source/Barvis
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name Barvis `
            --add-data "assets;assets" `
            --collect-all PySide6 `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all torch `
            --collect-all torchaudio `
            --collect-all sounddevice `
            --collect-all pyautogui `
            --collect-all pynput `
            --collect-all openwakeword `
            --collect-all onnxruntime `
            --hidden-import=webrtcvad `
            --hidden-import=pycaw.pycaw `
            --hidden-import=comtypes `
            main.py
          if (-not (Test-Path 'dist/Barvis.exe')) { throw 'PyInstaller did not create dist/Barvis.exe' }
          Copy-Item 'config.yaml' 'dist/config.yaml'
          Copy-Item 'run_barvis.bat' 'dist/run_barvis.bat'
          Copy-Item 'assets' 'dist/assets' -Recurse -Force
          @'
          БАРВИС — КРАТКИЙ СТАРТ

          1. Установи Ollama для Windows: https://ollama.com/download/windows
          2. Открой PowerShell или Terminal и выполни: ollama pull qwen3:8b
          3. Запусти Barvis.exe. Модели распознавания и синтеза речи могут скачиваться при первом использовании.
          4. Пользовательские данные хранятся в %APPDATA%\Barvis.

          Настройки можно менять в config.yaml рядом с Barvis.exe.
          Ollama и модель Qwen не входят в комплект.
          '@ | Set-Content 'dist/README-START.txt' -Encoding utf8
          Compress-Archive -Path 'dist/*' -DestinationPath 'Barvis-Windows.zip' -Force
          if (-not (Test-Path 'Barvis-Windows.zip')) { throw 'Distribution ZIP was not created' }
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Barvis-Windows
          path: ${{ runner.temp }}/barvis-source/Barvis/Barvis-Windows.zip
          if-no-files-found: error
          retention-days: 90
